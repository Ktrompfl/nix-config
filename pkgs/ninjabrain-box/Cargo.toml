[package]
name = "ninjabrain-box"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
calloop = "0.13"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
calloop-wayland-source = "0.3"
fontdue = "0.9"
rustix = { version = "0.38", features = ["pipe", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
textwrap = { version = "0.16", default-features = false }
tiny-skia = "0.11"
toml = "0.8"
wayland-client = "0.31"
xdg = "2"
x11rb = { version = "0.14", features = ["xtest"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = true
strip = true
